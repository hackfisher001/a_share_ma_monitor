# 话题监控：新闻 → 持仓相关逻辑（ClueArk 风格精简版）
#
# 流程：RSS 拉取 → 关键词命中话题 → 同话题聚类 → 可选 DeepSeek 摘要 → 仅进日/周报
# 不进盘中即时推送，避免飞书变新闻站。
#
# 日报格式每条：
#   [话题] 一句话事实 → 可能影响：名称(代码) → 今日涨跌是否同向

enabled: true
# 日报最多展示几条话题（同类报道已聚类）
max_topics: 5
# 拉取新闻的回溯窗口（小时）；周报在代码里会拉长到 7 天
lookback_hours: 36
# 标题归一化后相似度 ≥ 该值视为同一事件（简单词集合交并比）
cluster_jaccard: 0.55

# 公共信源（失败自动跳过，不阻断日报）
# 2026-09 在阿里云（47.95.122.231）实测：只保留可稳定拉到条目的源。
# 不通/超时：BBC、Google News、Investing、Yahoo、FT、NYT、Reuters Agency 等。
sources:
  # —— 国际财经（国内机可达）——
  - name: cnbc_top
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114
  - name: cnbc_finance
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664
  - name: cnbc_world
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100727362
  - name: marketwatch
    url: https://feeds.marketwatch.com/marketwatch/topstories/
  - name: wsj_markets
    url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
  # —— 国内（快、稳，覆盖收息仓/宏观中文关键词）——
  - name: chinanews_finance
    url: https://www.chinanews.com.cn/rss/finance.xml
  - name: chinanews_china
    url: https://www.chinanews.com.cn/rss/china.xml
  - name: people_finance
    url: http://www.people.com.cn/rss/finance.xml

