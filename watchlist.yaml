# 监控列表
#
# 定位（依据 docs/ 下两份回测，12.3 年样本、含 2015/2018/2022 三轮下跌）：
#
#   1. 「攒钱等回撤再买」在 13 个标的上 0 胜（定投与做T回测.md）。一次性资金
#      遍历 2205 个入场日后胜率也只有 27%（一次性资金入场时点回测.md）。
#      所以 MA30 和回撤提醒只是「现在贵还是便宜」的信息，不是推迟买入的理由。
#
#   2. 做 T 已关闭。它平均每年输给定投 2.82%，13 个标的只有 4 个赢；而且
#      招行偏好 -5%/+5%、中国移动偏好 -8%/+8%，两只对参数的偏好相反——
#      真有规律的话它们该一致。这说明那几个「赢」是负期望分布的右尾，
#      是样本内过拟合，不是可复现的优势。
#
# touch_pct: 现价相对 MA30 偏离 ≤ 该值时发走势提示
touch_pct: 0.5

# MA30、年度回撤和短期异常回撤留在日报摘要中，不即时打断。
# 盘中急跌不受此约束（见下）。若想恢复全部即时提醒，改为 false。
notifications:
  action_only: true

# 盘中急跌：用实时价对比昨收，每次巡检都判一次，跌破档位立刻推。
# 不受 action_only 屏蔽——这类提醒只在你还能下单的时候有价值。
# 每档每天最多推一次，次日重置。
#
# mode: sigma —— 档位按「该标的自身日波动率 σ」的倍数换算，而不是全表统一的固定百分比。
#   固定 -3% 在这份清单上是失效的：实测近 250 日，长江电力 σ=0.86%、美光 σ=5.15%，
#   相差 6 倍。同一个 -3% 对前者是 -3.5σ（一年触发 0 次，提醒等于不存在），
#   对后者是 -0.6σ（一年触发 48 次，约每 5 个交易日一次，纯噪音）。
#   按 σ 定档后，各标的「被提醒的稀有度」才可比。
#
#   sigma_levels: [2, 3, 4] 换算出来大致是：
#     长江电力 -1.7/-2.6/-3.4%　招商银行 -2.2/-3.3/-4.4%　纳指100ETF -2.5/-3.7/-4.9%
#     英伟达   -4.8/-7.2/-9.6%　特斯拉   -6.0/-9.0/-12%　美光 -10.3/-15.5/-20.6%
#   想更灵敏就调小（改 1.5 会让提醒数量大约翻三倍），想更安静就调大。
#
# min_abs_pct / max_abs_pct：σ 很小的标的 2σ 也只是个零点几的小数，不值得打断；
#   σ 异常大的标的则不该把首档推到永远够不到的深度。两头都夹一下。
# levels：mode 为 absolute 时使用；也是历史不足 60 根（σ 算不出来）时的兜底。
#   清单里 SPCX 就属于这种：2026-06-12 才上市，只有 59 根日线。
# 单只标的可用 dip_levels: [5, 8] 覆盖，优先级高于 σ 校准。
intraday_dip:
  enabled: true
  mode: sigma
  sigma_levels: [2.0, 3.0, 4.0]
  min_abs_pct: 1.5
  max_abs_pct: 20.0
  levels: [3.0, 5.0, 8.0]

# 归因基准：判断「是大盘在跌，还是它自己在跌」。
# 超额跌幅按 beta 调整后再算——否则 AMD、美光这类 β≈2 的标的会被系统性
# 误判成「个股独有事件」（大盘 -3% 时它跌 -7% 只是 beta，不是消息面）。
# 是否算「个股独有」则按该标的自身的残差 σ 判断（≥2× 常态残差），
# 同样不用固定百分比——美光的常态残差本就比长江电力大好几倍。
# 这两个基准标的本来就在清单里，所以不产生额外请求。
benchmarks:
  cn: "510300"
  us: "QQQM"

# 做 T 已关闭（见文件头第 2 条）。参数保留仅为让历史机动仓账本仍可读；
# 任何标的都不再设 swing_t: true，也不会再产生低吸/高抛提醒。
swing_t:
  enabled: false
  buy_drawdown_pct: 5.0
  sell_bounce_pct: 5.0
  rearm_pct: 4.0
  high_window: 252
  max_adds: 4
  escalate_pct: 3.0
  pending_ttl_days: 5

# 回撤观察（信息提醒，不改变定投主仓）：
# 现价较近一年（252 个交易日）收盘高点回撤，每跨过一档提醒一次。
# 回升到 -drawdown_reset_pct 以内后清空档位，下一轮下跌重新提醒。
drawdown_levels: [5, 10, 15, 20, 30, 40, 50]
drawdown_reset_pct: 3
drawdown_markets:
  - cn
  - us

# 近期异常回撤：相对该标的近一年自身波动的最差 10%（3日跌幅或距20日高点）
# 触发后冷却 recent_pullback_cooldown_days 天，避免同一段下跌反复刷屏。
recent_pullback: true
recent_pullback_percentile: 10
recent_pullback_cooldown_days: 7

