# 监控列表
#
# 定位（依据 docs/定投与做T回测.md，12.3 年样本、含 2015/2018/2022 三轮下跌）：
#   MA30 与回撤两类提醒都只是「现在贵还是便宜」的信息，不是让你推迟买入。
#   回测里「攒钱等回撤」在 13 个标的上 0 胜，等得越久越差，工资到账就买最优。
#   做 T 只对回测中两组参数都跑赢定投的标的开启，见下方 swing_t。
#
# touch_pct: 现价相对 MA30 偏离 ≤ 该值时发走势提示
touch_pct: 0.5

# 默认只推送需要你执行或确认的动作：做T低吸/高抛。
# MA30、年度回撤和短期异常回撤会留在日报摘要中，不再打断你。
# 若你确实想恢复旧版全部即时提醒，改为 false。
notifications:
  action_only: true

# 发薪日提醒：回测里唯一被验证有效的动作，所以它按日历触发、不看价格。
# day 为工资到账日；bonus_months 里的月份会额外提示年终奖一次性买入。
payday:
  enabled: true
  workday: 1          # 每月第几个工作日（周一到周五）
  bonus_months: [2]   # 年终奖月份
  bonus_workday: 1

# 盘中急跌：用实时价对比昨收，每次巡检都判一次，跌破档位立刻推。
# 不受 action_only 屏蔽——这类提醒只在你还能下单的时候有价值。
# 每档每天最多推一次，次日重置。
intraday_dip:
  enabled: true
  levels: [3.0, 5.0, 8.0]

# 做 T（低吸 / 高抛）：仅对个股里 swing_t: true 的标的生效。
# 参数即回测变体 G：距 252 日高点 -5% 低吸，机动仓均价 +5% 高抛。
# 成长股与所有 ETF 一律不开——回测中它们每年输给定投 3%~9%。
swing_t:
  buy_drawdown_pct: 5.0
  sell_bounce_pct: 5.0
  # 低吸后解除武装，回升到距高点 -4% 以内才重新武装，避免一路下跌天天提醒
  rearm_pct: 4.0
  high_window: 252
  max_adds: 4
  # 待确认提醒不会永久静音：再跌 escalate_pct 或挂满 pending_ttl_days 天就重提，
  # 否则漏记一次会让这只票的做T彻底哑掉。
  escalate_pct: 3.0
  pending_ttl_days: 5

# 回撤观察（信息提醒，不改变定投主仓）：
# 现价较近一年（252 个交易日）收盘高点回撤，每跨过一档提醒一次。
# 回升到 -drawdown_reset_pct 以内后清空档位，下一轮下跌重新提醒。
drawdown_levels: [5, 10, 15, 20, 30, 40, 50]
drawdown_reset_pct: 3
drawdown_markets:
  - cn
  - us

# 近期异常回撤：相对该标的近一年自身波动的最差 10%（3日跌幅或距20日高点）
# 触发后冷却 recent_pullback_cooldown_days 天，避免同一段下跌反复刷屏。
recent_pullback: true
recent_pullback_percentile: 10
recent_pullback_cooldown_days: 7

