name: A-share MA30 Monitor

# 正式监控在阿里云 crontab 上跑。这里不再定时执行，
# 避免 GitHub Actions 缺 FEISHU_WEBHOOK_URL 反复失败刷邮件。
on:
  workflow_dispatch:

concurrency:
  group: ma-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Run monitor
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          STATE_FILE: data/alert_state.json
        run: python -m src.main

      - name: Persist alert state path
        if: always()
        run: |
          mkdir -p data
          test -f data/alert_state.json || echo '{"date":"","alerted":[]}' > data/alert_state.json
